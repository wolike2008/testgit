<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹窗示例</title>
<style>
  .modal {
    display: none; /* 默认隐藏 */
    position: fixed; /* 固定定位 */
    z-index: 1; /* 位于顶层 */
    left: 0;
    top: 0;
    width: 100%; /* 全宽 */
    height: 100%; /* 全高 */
    overflow: auto; /* 启用滚动 */
    background-color: rgba(0,0,0,0.4); /* 背景颜色，带有透明度 */
  }
  .modal-content {
    background-color: #fefefe;
    margin: 15% auto; /* 15% 从顶部和自动水平居中 */
    padding: 20px;
    border: 1px solid #888;
    width: 80%; /* 可根据需要调整宽度 */
  }
</style>
</head>
<body>
